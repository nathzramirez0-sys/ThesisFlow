org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Host that serves invite links (https://<host>/join/<code>).
# Change this to your Firebase Hosting domain, e.g. my-project.web.app
thesisflow.inviteHost=thesisflow-63504.web.app

# Debug builds talk to the Firebase Local Emulator Suite when this is true.
# 10.0.2.2 is the host machine as seen from the Android emulator.
thesisflow.useEmulators=false
thesisflow.emulatorHost=10.0.2.2
