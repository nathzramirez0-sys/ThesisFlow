<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThesisFlow</title>
  <style>
    :root { --bg: #f7f7fc; --fg: #1b1b21; --muted: #5b5d72; }
    @media (prefers-color-scheme: dark) { :root { --bg: #131318; --fg: #e4e1e9; --muted: #c4c5dd; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
           color: var(--fg); font: 16px/1.5 system-ui, sans-serif; text-align: center; }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>ThesisFlow</h1>
    <p>A thesis and group project manager for college students in the Philippines.</p>
  </main>
</body>
</html>
